name: Fold ledger

# After a merge, append pending entries one at a time onto the current tip
# and rebuild the catalog and dashboard. A contributor's PR does not edit
# the shared chain or those generated files.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fold-ledger
  cancel-in-progress: false

jobs:
  fold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fold pending entries onto the tip
        run: python3 ledger/fold_pending.py
      - name: Rebuild catalog and dashboard
        run: |
          python3 scripts/build_catalog.py
          python3 scripts/build_dashboard.py
      - name: Verify the chain
        run: python3 ledger/verify.py
      - name: Commit fold, catalog, and dashboard
        run: |
          git add -u -- ledger registry commons.json catalog.json catalog.txt llms.txt cells dashboard
          git add -- dashboard  # new generated files too (e.g. a new dataset)
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fold pending ledger entries and rebuild catalog and dashboard"
          git push origin HEAD:main
