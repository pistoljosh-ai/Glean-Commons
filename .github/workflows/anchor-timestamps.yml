name: Anchor timestamps

# Free OpenTimestamps proofs of the ledger tip and the git commit/tree.
# No tokens, no accounts, no secrets. Bitcoin confirmation arrives later;
# the daily job upgrades calendar proofs once a block anchors them.
on:
  push:
    tags: ["*"]
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: write

concurrency:
  group: anchor-timestamps
  cancel-in-progress: false

jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenTimestamps client
        run: pip install opentimestamps-client
      - name: Stamp this commit
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: python3 scripts/anchor_ledger.py stamp --commit "${{ github.sha }}"
      - name: Upgrade proofs that Bitcoin has confirmed
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/anchor_ledger.py upgrade
      - name: Commit proofs onto main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/anchor-out
          if [ -d anchors ]; then cp -a anchors/. /tmp/anchor-out/; fi
          git checkout --force main
          git pull --ff-only origin main
          mkdir -p anchors
          cp -a /tmp/anchor-out/. anchors/
          git add anchors
          if git diff --cached --quiet; then
            echo "No proof changes."
            exit 0
          fi
          git commit -m "Anchor ledger tip with OpenTimestamps"
          git push origin HEAD:main
