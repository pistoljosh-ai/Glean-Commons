name: Verify ledger

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify hash-linked ledger and commons manifests
        run: python3 ledger/verify.py
      - name: Validate pending ledger entries
        run: python3 ledger/validate_pending.py
      - name: Every contribution carries its credit
        if: github.event_name == 'pull_request'
        env:
          NO_CREDIT: ${{ contains(github.event.pull_request.labels.*.name, 'no-credit') && '1' || '0' }}
        run: python3 scripts/check_credit.py origin/${{ github.base_ref }}
      - name: Shared variants fit, are unaltered, and pass their tool's tests; one adoption voice per account
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 scripts/check_variants.py origin/${{ github.base_ref || 'main' }}
      - name: Test credit check
        run: python3 tests/test_credit.py
      - name: Catalog and dashboard still build
        run: |
          python3 scripts/build_catalog.py
          python3 scripts/build_dashboard.py
          echo "The fold workflow rebuilds and commits these on every push to main, so a merge that changes them (an adoption record, a docs edit) never leaves main stale or red."
      - name: Test catalog search
        run: python3 tests/test_catalog.py
      - name: Test Glean Router
        run: python3 router/test_route.py
      - name: Test cells
        run: for t in cells/*/test_*.py; do echo "== $t"; python3 "$t" || exit 1; done
      - name: Test MCP tool server end to end
        run: |
          python3 mcp/test_server.py
          python3 mcp/test_front_door.py
      - name: Test your-own-version tools (make, keep, switch, share, adopt, promote)
        run: |
          python3 variants/test_variants.py
          python3 mcp/test_versions.py
          python3 tests/test_variants_commons.py
