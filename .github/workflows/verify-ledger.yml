name: Verify ledger

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify hash-linked ledger and commons manifests
        run: python3 ledger/verify.py
      - name: Validate pending ledger entries
        run: python3 ledger/validate_pending.py
      - name: Every contribution carries its credit
        if: github.event_name == 'pull_request'
        env:
          NO_CREDIT: ${{ contains(github.event.pull_request.labels.*.name, 'no-credit') && '1' || '0' }}
        run: python3 scripts/check_credit.py origin/${{ github.base_ref }}
      - name: Test credit check
        run: python3 tests/test_credit.py
      - name: On main, committed catalog and dashboard must match when nothing is pending
        if: github.event_name == 'push'
        run: |
          pending=$(find ledger/pending registry/pending -name '*.json' 2>/dev/null | wc -l)
          if [ "$pending" -eq 0 ]; then
            python3 scripts/build_catalog.py
            python3 scripts/build_dashboard.py
            git diff --exit-code -- catalog.json catalog.txt llms.txt dashboard/
          else
            echo "Pending entries are folded on main; catalog and dashboard are rebuilt by the fold workflow."
          fi
      - name: Test catalog search
        run: python3 tests/test_catalog.py
      - name: Test Glean Router
        run: python3 router/test_route.py
      - name: Test cells
        run: for t in cells/*/test_*.py; do echo "== $t"; python3 "$t" || exit 1; done
      - name: Test MCP tool server end to end
        run: python3 mcp/test_server.py
